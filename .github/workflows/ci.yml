name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - name: Verify examples generated files are current
        run: node dist-tooling/tooling/cli/bin.js check --config examples/netsuite-repository.config.json

      - run: npm run pack:dry-run
